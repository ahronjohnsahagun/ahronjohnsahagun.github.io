<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahron John Sahagun | Portfolio</title>
  <meta name="description" content="Portfolio of Ahron John Sahagun, Computer Science student.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. VARIABLES & RESET
       ========================================================= */
    :root {
      --bg: #0a0e14;
      --panel: #10161f;
      --line: #1e2733;
      --text: #e8eef5;
      --muted: #8593a6;
      --mint: #5ff5c0;
      --blue: #6f8bff;
      --coral: #ff7a59;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    main,
    footer {
      position: relative;
      z-index: 1;
    }

    /* =========================================================
       2. SHARED COMPONENTS
       ========================================================= */
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.4rem;
    }

    .label {
      font-family: var(--mono);
      font-size: .75rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .btn {
      display: inline-block;
      font-family: var(--mono);
      font-size: .85rem;
      padding: .8rem 1.3rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(10, 14, 20, .4);
      transition: all .2s;
    }

    .btn:hover {
      border-color: var(--mint);
      color: var(--mint);
      transform: translateY(-2px);
    }

    .btn.fill {
      background: var(--mint);
      color: #04130d;
      border-color: var(--mint);
      font-weight: 500;
    }

    .btn.fill:hover {
      color: #04130d;
      box-shadow: 0 8px 24px rgba(95, 245, 192, .28);
    }

    .note {
      color: var(--muted);
      font-family: var(--mono);
      font-size: .85rem;
    }

    /* =========================================================
       3. ANIMATED BACKGROUND
       ========================================================= */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .5;
      will-change: transform;
    }

    .orb.o1 {
      width: 520px;
      height: 520px;
      top: -140px;
      right: -100px;
      background: rgba(111, 139, 255, .30);
      animation: drift1 24s ease-in-out infinite alternate;
    }

    .orb.o2 {
      width: 460px;
      height: 460px;
      top: 30%;
      left: -140px;
      background: rgba(95, 245, 192, .20);
      animation: drift2 30s ease-in-out infinite alternate;
    }

    .orb.o3 {
      width: 380px;
      height: 380px;
      bottom: -120px;
      right: 20%;
      background: rgba(255, 122, 89, .14);
      animation: drift3 27s ease-in-out infinite alternate;
    }

    @keyframes drift1 { to { transform: translate(-220px, 260px) scale(1.2); } }
    @keyframes drift2 { to { transform: translate(300px, -180px) scale(1.15); } }
    @keyframes drift3 { to { transform: translate(-260px, -200px) scale(1.25); } }

    .grid-bg {
      position: absolute;
      inset: -60px;
      background-image:
        linear-gradient(rgba(95, 245, 192, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 245, 192, .045) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      animation: gridmove 14s linear infinite;
    }

    @keyframes gridmove { to { transform: translate(60px, 60px); } }

    #bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       4. NAVIGATION
       ========================================================= */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(10, 14, 20, .7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    nav .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 60px;
    }

    .brand {
      font-family: var(--mono);
      font-weight: 500;
    }

    .brand span {
      color: var(--mint);
    }

    .links {
      display: flex;
      gap: 1.6rem;
    }

    .links a {
      font-family: var(--mono);
      font-size: .82rem;
      color: var(--muted);
      transition: color .2s;
    }

    .links a:hover {
      color: var(--mint);
    }

    /* =========================================================
       5. HERO
       ========================================================= */
    .hero {
      padding: 4.5rem 0 3rem;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      gap: 3rem;
      align-items: center;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.4rem);
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -.03em;
      margin: 1rem 0 1.2rem;
      padding-left: 1.1rem;
      border-left: 4px solid var(--mint);
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(90deg, var(--mint), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p.intro {
      color: var(--muted);
      font-size: 1.08rem;
      max-width: 520px;
      margin-bottom: 1.8rem;
    }

    /* Portrait */
    .portrait-wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4 / 5;
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      overflow: hidden;
    }

    .portrait-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(95, 245, 192, .10), transparent 65%);
    }

    #portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .tag {
      position: absolute;
      left: 14px;
      bottom: 12px;
      font-family: var(--mono);
      font-size: .72rem;
      color: var(--muted);
      background: rgba(10, 14, 20, .7);
      padding: .25rem .6rem;
      border-radius: 4px;
      border: 1px solid var(--line);
    }

    .fallback {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      font-weight: 700;
      color: var(--mint);
    }

    .no-photo #portrait { display: none; }
    .no-photo .fallback { display: flex; }

    /* =========================================================
       6. INFO STRIP
       ========================================================= */
    .strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(16, 22, 31, .85);
    }

    .strip div {
      padding: 1.1rem 1.3rem;
      border-right: 1px solid var(--line);
    }

    .strip div:last-child {
      border-right: 0;
    }

    .strip b {
      display: block;
      font-weight: 500;
      margin-top: .2rem;
      font-size: .95rem;
    }

    /* =========================================================
       7. SECTIONS (About, Projects, Contact)
       ========================================================= */
    section {
      padding: 5rem 0 1rem;
    }

    h2 {
      font-size: 2rem;
      letter-spacing: -.02em;
      margin: .4rem 0 1.6rem;
    }

    .about-text {
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 1.4rem;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
    }

    .skills span {
      font-family: var(--mono);
      font-size: .8rem;
      padding: .35rem .8rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text);
      background: rgba(10, 14, 20, .4);
    }

    .skills span::before {
      content: "▪ ";
      color: var(--mint);
    }

    /* Project cards */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1.1rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      padding: 1.4rem;
      background: rgba(16, 22, 31, .88);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: transform .2s, border-color .2s;
    }

    a.card:hover {
      transform: translateY(-4px);
      border-color: var(--mint);
    }

    .card h3 {
      font-size: 1.1rem;
    }

    .card p {
      color: var(--muted);
      font-size: .92rem;
      flex: 1;
    }

    .card .meta {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--mint);
      display: flex;
      gap: .9rem;
      flex-wrap: wrap;
    }

    .card .feat {
      font-family: var(--mono);
      font-size: .68rem;
      letter-spacing: .12em;
      color: var(--coral);
      text-transform: uppercase;
    }

    /* Contact */
    .contact {
      text-align: center;
      padding: 3rem 1.5rem;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(16, 22, 31, .88);
    }

    .contact p {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    /* =========================================================
       8. FOOTER & SCROLL REVEAL
       ========================================================= */
    footer {
      text-align: center;
      padding: 3rem 0 2.5rem;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .78rem;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .7s, transform .7s;
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
    }

    /* =========================================================
       9. RESPONSIVE & ACCESSIBILITY
       ========================================================= */
    @media (max-width: 820px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .portrait-wrap {
        margin: 0 auto;
        order: -1;
        max-width: 320px;
      }

      .strip {
        grid-template-columns: 1fr 1fr;
      }

      .strip div:nth-child(2) {
        border-right: 0;
      }

      .strip div:nth-child(-n+2) {
        border-bottom: 1px solid var(--line);
      }

      .links a:not(:last-child) {
        display: none;
      }

      .orb {
        filter: blur(60px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orb,
      .grid-bg {
        animation: none;
      }

      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

    /* =========================================================

       ========================================================= */
    const $ = (id) => document.getElementById(id);

    const esc = (s) =>
      String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",

      }[c]));

    /* =========================================================

    function renderStaticContent() {

    /* =========================================================
       ANIMATED BACKGROUND: particle network
       ========================================================= */
    function initBackground() {
      const cvs = $("bg");
      const ctx = cvs.getContext("2d");

      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const COLORS = ["95,245,192", "111,139,255", "95,245,192", "255,122,89"];
      const LINK = 130;
      const MOUSE_LINK = 170;

      let w = 0;
      let h = 0;
      let dots = [];
      let mouse = { x: -9999, y: -9999 };
      let raf = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        w = window.innerWidth;
        h = window.innerHeight;

        cvs.width = w * dpr;
        cvs.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.max(35, Math.min(110, Math.floor((w * h) / 15000)));

        dots = Array.from({ length: count }, () => ({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.45,
          vy: (Math.random() - 0.5) * 0.45,
          r: Math.random() * 1.6 + 0.8,
          c: COLORS[Math.floor(Math.random() * COLORS.length)],
          p: Math.random() * Math.PI * 2
        }));

        if (reduce) frame(0);
      }

      function frame(t) {
        ctx.clearRect(0, 0, w, h);

        // Move particles
        for (const d of dots) {
          if (reduce) continue;

          d.x += d.vx;
          d.y += d.vy;

          if (d.x < -20) d.x = w + 20;
          else if (d.x > w + 20) d.x = -20;

          if (d.y < -20) d.y = h + 20;
          else if (d.y > h + 20) d.y = -20;

          // Push away from the cursor
          const dx = d.x - mouse.x;
          const dy = d.y - mouse.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 110 && dist > 0) {
            d.x += (dx / dist) * 1.2;
            d.y += (dy / dist) * 1.2;
          }
        }

        // Connect nearby particles (and the cursor)
        for (let i = 0; i < dots.length; i++) {
          const a = dots[i];

          for (let j = i + 1; j < dots.length; j++) {
            const b = dots[j];
            const dist = Math.hypot(a.x - b.x, a.y - b.y);

            if (dist < LINK) {
              ctx.strokeStyle = `rgba(${a.c},${(1 - dist / LINK) * 0.28})`;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }

          const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);

          if (md < MOUSE_LINK) {
            ctx.strokeStyle = `rgba(95,245,192,${(1 - md / MOUSE_LINK) * 0.55})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }

        // Draw particles
        for (const d of dots) {
          const pulse = reduce ? 1 : 0.75 + 0.25 * Math.sin(t / 700 + d.p);

          ctx.fillStyle = `rgba(${d.c},${0.75 * pulse})`;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r * pulse + 0.2, 0, Math.PI * 2);
          ctx.fill();
        }

        if (!reduce) raf = requestAnimationFrame(frame);
      }

      // Pointer tracking
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      window.addEventListener("touchmove", (e) => {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }, { passive: true });

      window.addEventListener("mouseout", () => {
        mouse.x = mouse.y = -9999;
      });

      window.addEventListener("touchend", () => {
        mouse.x = mouse.y = -9999;
      });

      // Debounced resize
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 150);
      });

      // Pause when tab is hidden
      document.addEventListener("visibilitychange", () => {
        if (reduce) return;

        if (document.hidden) {
          cancelAnimationFrame(raf);
        } else {
          raf = requestAnimationFrame(frame);
        }
      });

      resize();
      if (!reduce) raf = requestAnimationFrame(frame);
    }

    /* =========================================================
       HALFTONE PORTRAIT (built from photo.jpg)
       ========================================================= */
    function initPortrait() {
      const cvs = $("portrait");
      const ctx = cvs.getContext("2d");

      const img = new Image();
      const COLS = 48;

      let cells = [];
      let w = 0;
      let h = 0;
      let mouse = { x: -999, y: -999 };
      let queued = false;

      img.onerror = () => $("portrait-wrap").classList.add("no-photo");
      img.onload = build;
      img.src = CONFIG.photo;

      function build() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        w = cvs.clientWidth;
        h = cvs.clientHeight;

        cvs.width = w * dpr;
        cvs.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const step = w / COLS;
        const rows = Math.round(h / step);

        // Downsample the photo onto a tiny offscreen canvas
        const off = document.createElement("canvas");
        off.width = COLS;
        off.height = rows;

        const o = off.getContext("2d", { willReadFrequently: true });

        const sw = Math.min(img.width, (img.height * COLS) / rows);
        const sh = (sw * rows) / COLS;

        o.drawImage(
          img,
          (img.width - sw) / 2,
          (img.height - sh) * 0.2,
          sw,
          sh,
          0,
          0,
          COLS,
          rows
        );

        let data;

        try {
          data = o.getImageData(0, 0, COLS, rows).data;
        } catch (e) {
          $("portrait-wrap").classList.add("no-photo");
          return;
        }

        // Turn each pixel into a dot sized by brightness
        cells = [];

        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < COLS; x++) {
            const i = (y * COLS + x) * 4;

            const lum = (
              0.299 * data[i] +
              0.587 * data[i + 1] +
              0.114 * data[i + 2]
            ) / 255;

            if (lum > 0.93 || data[i + 3] < 40) continue;

            cells.push({
              x: (x + 0.5) * step,
              y: (y + 0.5) * step,
              r: step * 0.5 * (0.35 + 0.65 * Math.pow(lum, 0.7)),
              t: y / rows
            });
          }
        }

        draw();
      }

      function draw() {
        queued = false;
        ctx.clearRect(0, 0, w, h);

        for (const c of cells) {
          // Dots near the cursor grow and shift color
          const k = Math.max(0, 1 - Math.hypot(c.x - mouse.x, c.y - mouse.y) / 90);
          const hue = k > 0 ? 160 - k * 140 : 160 + c.t * 70;

          ctx.fillStyle = `hsl(${hue}, 90%, 62%)`;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r * (1 + k * 0.7), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function move(x, y) {
        const b = cvs.getBoundingClientRect();
        mouse = { x: x - b.left, y: y - b.top };

        if (!queued) {
          queued = true;
          requestAnimationFrame(draw);
        }
      }

      cvs.addEventListener("mousemove", (e) => move(e.clientX, e.clientY));

      cvs.addEventListener("touchmove", (e) => {
        move(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      cvs.addEventListener("mouseleave", () => {
        mouse = { x: -999, y: -999 };
        draw();
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (img.complete) build();
        }, 200);
      });
    }

    /* =========================================================
       PROJECT CARDS
       ========================================================= */
    function card({ name, desc, meta, link, featured }) {
      const inner = `
        ${featured ? '<span class="feat">featured</span>' : ""}
        <h3>${esc(name)}</h3>
        <p>${esc(desc || "No description provided.")}</p>
        <div class="meta">
          ${meta.map((m) => `<span>${esc(m)}</span>`).join("")}
        </div>
      `;

      return link
        ? `<a class="card" href="${esc(link)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="card">${inner}</div>`;
    }

    async function loadProjects() {
      const grid = $("project-grid");

      const items = CONFIG.featured.map((f) => ({
        name: f.name,
        desc: f.desc,
        meta: f.tags,
        link: f.link,
        featured: true
      }));

      const taken = CONFIG.featured.map((f) =>
        f.name.toLowerCase().replace(/\s+/g, "")
      );

      try {
        const res = await fetch(
          `https://api.github.com/users/${CONFIG.githubUser}/repos?per_page=100&sort=updated`
        );

        if (!res.ok) throw new Error(res.status);

        const repos = (await res.json())
          .filter((r) =>
            !r.fork &&
            !CONFIG.hideRepos.includes(r.name) &&
            r.name.toLowerCase() !== `${CONFIG.githubUser.toLowerCase()}.github.io` &&
            !taken.includes(r.name.toLowerCase().replace(/[-_\s]/g, ""))
          )
          .sort((a, b) =>
            (CONFIG.pinnedRepos.includes(b.name) - CONFIG.pinnedRepos.includes(a.name)) ||
            new Date(b.pushed_at) - new Date(a.pushed_at)
          )
          .slice(0, CONFIG.maxRepos);

        repos.forEach((r) => {
          items.push({
            name: r.name,
            desc: r.description,
            meta: [r.language, r.stargazers_count ? `★ ${r.stargazers_count}` : ""].filter(Boolean),
            link: r.html_url
          });
        });
      } catch (e) {
        // GitHub unreachable: featured projects still appear
      }

      grid.innerHTML = items.length
        ? items.map(card).join("")
        : '<p class="note">No public projects yet.</p>';
    }

    /* =========================================================
       SCROLL REVEAL
       ========================================================= */
    function initReveal() {
      const io = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              e.target.classList.add("visible");
              io.unobserve(e.target);
            }
          });
        },
        { threshold: 0.1 }
      );

      document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
    }

    /* =========================================================
       INIT
       ========================================================= */
    renderStaticContent();
    initBackground();
    initPortrait();
    loadProjects();
    initReveal();
  </script>

</body>
