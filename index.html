<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahron John Sahagun | Portfolio</title>
  <meta name="description" content="Portfolio of Ahron John Sahagun, Computer Science student.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e14;
      --panel: #10161f;
      --line: #1e2733;
      --text: #e8eef5;
      --muted: #8593a6;
      --mint: #5ff5c0;
      --blue: #6f8bff;
      --coral: #ff7a59;
      --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans);
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(111,139,255,.14), transparent 60%),
        radial-gradient(700px 500px at -10% 30%, rgba(95,245,192,.08), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 1.4rem; }
    .label { font-family: var(--mono); font-size: .75rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

    /* Navigation */
    nav { position: sticky; top: 0; z-index: 10; background: rgba(10,14,20,.8); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    nav .wrap { display: flex; justify-content: space-between; align-items: center; height: 60px; }
    .brand { font-family: var(--mono); font-weight: 500; }
    .brand span { color: var(--mint); }
    .links { display: flex; gap: 1.6rem; }
    .links a { font-family: var(--mono); font-size: .82rem; color: var(--muted); transition: color .2s; }
    .links a:hover { color: var(--mint); }

    /* Hero */
    .hero { padding: 4.5rem 0 3rem; display: grid; grid-template-columns: 1.15fr .85fr; gap: 3rem; align-items: center; }
    .hero h1 {
      font-size: clamp(2.4rem, 6vw, 4.4rem); line-height: 1.05; font-weight: 700;
      letter-spacing: -.03em; margin: 1rem 0 1.2rem; padding-left: 1.1rem; border-left: 4px solid var(--mint);
    }
    .hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--mint), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p.intro { color: var(--muted); font-size: 1.08rem; max-width: 520px; margin-bottom: 1.8rem; }
    .btn { display: inline-block; font-family: var(--mono); font-size: .85rem; padding: .8rem 1.3rem; border: 1px solid var(--line); border-radius: 6px; transition: all .2s; }
    .btn:hover { border-color: var(--mint); color: var(--mint); transform: translateY(-2px); }
    .btn.fill { background: var(--mint); color: #04130d; border-color: var(--mint); font-weight: 500; }
    .btn.fill:hover { color: #04130d; box-shadow: 0 8px 24px rgba(95,245,192,.28); }

    /* Portrait */
    .portrait-wrap { position: relative; width: 100%; max-width: 400px; aspect-ratio: 4 / 5; margin-left: auto; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); overflow: hidden; }
    .portrait-wrap::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 35%, rgba(95,245,192,.10), transparent 65%); }
    #portrait { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tag { position: absolute; left: 14px; bottom: 12px; font-family: var(--mono); font-size: .72rem; color: var(--muted); background: rgba(10,14,20,.7); padding: .25rem .6rem; border-radius: 4px; border: 1px solid var(--line); }
    .fallback { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font-size: 5rem; font-weight: 700; color: var(--mint); }
    .no-photo #portrait { display: none; }
    .no-photo .fallback { display: flex; }

    /* Info strip */
    .strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .strip div { padding: 1.1rem 1.3rem; border-right: 1px solid var(--line); }
    .strip div:last-child { border-right: 0; }
    .strip b { display: block; font-weight: 500; margin-top: .2rem; font-size: .95rem; }

    /* Sections */
    section { padding: 5rem 0 1rem; }
    h2 { font-size: 2rem; letter-spacing: -.02em; margin: .4rem 0 1.6rem; }
    .about-text { color: var(--muted); max-width: 680px; margin-bottom: 1.4rem; }
    .skills { display: flex; flex-wrap: wrap; gap: .55rem; }
    .skills span { font-family: var(--mono); font-size: .8rem; padding: .35rem .8rem; border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
    .skills span::before { content: "▪ "; color: var(--mint); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1.1rem; }
    .card { display: flex; flex-direction: column; gap: .6rem; padding: 1.4rem; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; transition: transform .2s, border-color .2s; }
    a.card:hover { transform: translateY(-4px); border-color: var(--mint); }
    .card h3 { font-size: 1.1rem; }
    .card p { color: var(--muted); font-size: .92rem; flex: 1; }
    .card .meta { font-family: var(--mono); font-size: .75rem; color: var(--mint); display: flex; gap: .9rem; flex-wrap: wrap; }
    .card .feat { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; color: var(--coral); text-transform: uppercase; }
    .note { color: var(--muted); font-family: var(--mono); font-size: .85rem; }

    .contact { text-align: center; padding: 3rem 1.5rem; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); }
    .contact p { color: var(--muted); margin-bottom: 1.5rem; }
    footer { text-align: center; padding: 3rem 0 2.5rem; color: var(--muted); font-family: var(--mono); font-size: .78rem; }

    .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s, transform .7s; }
    .reveal.visible { opacity: 1; transform: none; }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; }
      .portrait-wrap { margin: 0 auto; order: -1; max-width: 320px; }
      .strip { grid-template-columns: 1fr 1fr; }
      .strip div:nth-child(2) { border-right: 0; }
      .strip div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .links a:not(:last-child) { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="wrap">
      <a href="#" class="brand">~/<span id="brand"></span></a>
      <div class="links">
        <a href="#about">about</a>
        <a href="#projects">projects</a>
        <a href="#contact">contact</a>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <header class="hero">
      <div>
        <span class="label" id="role"></span>
        <h1 id="headline"></h1>
        <p class="intro" id="intro"></p>
        <a href="#projects" class="btn fill">View projects</a>
        <a href="#contact" class="btn">Contact me</a>
      </div>
      <div class="portrait-wrap" id="portrait-wrap">
        <canvas id="portrait"></canvas>
        <div class="fallback" id="fallback"></div>
        <span class="tag" id="tag"></span>
      </div>
    </header>

    <div class="strip reveal" id="strip"></div>

    <section id="about" class="reveal">
      <span class="label">01 / about</span>
      <h2>A bit about me</h2>
      <p class="about-text" id="about-text"></p>
      <div class="skills" id="skills"></div>
    </section>

    <section id="projects" class="reveal">
      <span class="label">02 / projects</span>
      <h2>Things I've built</h2>
      <div class="grid" id="project-grid"><p class="note">Loading projects…</p></div>
    </section>

    <section id="contact" class="reveal">
      <div class="contact">
        <span class="label">03 / contact</span>
        <h2>Let's work together</h2>
        <p>Open to internships, collaborations, and new ideas.</p>
        <a class="btn fill" id="email-btn" href="#">Send an email</a>
        <a class="btn" id="gh-btn" href="#" target="_blank" rel="noopener">GitHub</a>
      </div>
    </section>
  </main>

  <footer>© <span id="year"></span> <span id="footer-name"></span></footer>

  <script>
    /* ===== CONFIG: edit this block only ===== */
    const CONFIG = {
      githubUser: "ahronjohnsahagun",
      name: "Ahron John Sahagun",
      handle: "ahronjohnsahagun",
      initials: "AJ",
      photo: "photo.jpg",
      location: "Baguio City",
      role: "Computer Science student",
      headline: "I turn ideas into <em>working software.</em>",
      intro: "Student developer at Saint Louis University who builds desktop apps, data-structure projects, and web interfaces.",
      about: "Write two or three sentences about your background, what you are studying, and what you enjoy building.",
      info: [
        ["Based in", "Baguio City, PH"],
        ["Studying", "Computer Science"],
        ["Focus", "Java, data structures, web"],
        ["Status", "Open to internships"]
      ],
      skills: ["Java", "JavaFX", "Swing", "Data Structures", "HTML & CSS", "JavaScript", "Git & GitHub"],
      email: "your-email@example.com",
      featured: [
        { name: "Curriculum Ledger", desc: "Java Swing app for tracking academic progress, built as a finals project.", tags: ["Java", "Swing"], link: "" },
        { name: "Tuwali Translator", desc: "Java Swing translator from Tuwali (Ifugao) to English, built as a group finals project.", tags: ["Java", "Swing"], link: "" }
      ],
      maxRepos: 9,
      hideRepos: [],
      pinnedRepos: []
    };
    /* ======================================== */

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    // Static content
    document.title = `${CONFIG.name} | Portfolio`;
    $("brand").textContent = CONFIG.handle;
    $("role").textContent = CONFIG.role;
    $("headline").innerHTML = CONFIG.headline;
    $("intro").textContent = CONFIG.intro;
    $("about-text").textContent = CONFIG.about;
    $("fallback").textContent = CONFIG.initials;
    $("tag").textContent = `@${CONFIG.handle} · ${CONFIG.location}`;
    $("footer-name").textContent = CONFIG.name;
    $("year").textContent = new Date().getFullYear();
    $("email-btn").href = "mailto:" + CONFIG.email;
    $("gh-btn").href = "https://github.com/" + CONFIG.githubUser;
    $("skills").innerHTML = CONFIG.skills.map(s => `<span>${esc(s)}</span>`).join("");
    $("strip").innerHTML = CONFIG.info.map(([k, v]) =>
      `<div><span class="label">${esc(k)}</span><b>${esc(v)}</b></div>`).join("");

    // Halftone portrait built from the photo
    function initPortrait() {
      const cvs = $("portrait"), ctx = cvs.getContext("2d");
      const img = new Image();
      const COLS = 48;
      let cells = [], w = 0, h = 0, mouse = { x: -999, y: -999 }, queued = false;

      img.onerror = () => $("portrait-wrap").classList.add("no-photo");
      img.onload = build;
      img.src = CONFIG.photo;

      function build() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = cvs.clientWidth; h = cvs.clientHeight;
        cvs.width = w * dpr; cvs.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const step = w / COLS, rows = Math.round(h / step);
        const off = document.createElement("canvas");
        off.width = COLS; off.height = rows;
        const o = off.getContext("2d", { willReadFrequently: true });

        // Crop the photo to the frame ratio, biased toward the top
        const sw = Math.min(img.width, img.height * COLS / rows);
        const sh = sw * rows / COLS;
        o.drawImage(img, (img.width - sw) / 2, (img.height - sh) * 0.2, sw, sh, 0, 0, COLS, rows);

        let data;
        try { data = o.getImageData(0, 0, COLS, rows).data; }
        catch (e) { $("portrait-wrap").classList.add("no-photo"); return; }

        cells = [];
        for (let y = 0; y < rows; y++) {
          for (let x = 0; x < COLS; x++) {
            const i = (y * COLS + x) * 4;
            const lum = (0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) / 255;
            if (lum > 0.93 || data[i + 3] < 40) continue; // skip the plain background
            cells.push({
              x: (x + 0.5) * step,
              y: (y + 0.5) * step,
              r: step * 0.5 * (0.35 + 0.65 * Math.pow(lum, 0.7)),
              t: y / rows
            });
          }
        }
        draw();
      }

      function draw() {
        queued = false;
        ctx.clearRect(0, 0, w, h);
        for (const c of cells) {
          const k = Math.max(0, 1 - Math.hypot(c.x - mouse.x, c.y - mouse.y) / 90);
          const hue = k > 0 ? 160 - k * 140 : 160 + c.t * 70;
          ctx.fillStyle = `hsl(${hue}, 90%, 62%)`;
          ctx.beginPath();
          ctx.arc(c.x, c.y, c.r * (1 + k * 0.7), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const move = (x, y) => {
        const b = cvs.getBoundingClientRect();
        mouse = { x: x - b.left, y: y - b.top };
        if (!queued) { queued = true; requestAnimationFrame(draw); }
      };
      cvs.addEventListener("mousemove", e => move(e.clientX, e.clientY));
      cvs.addEventListener("touchmove", e => move(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      cvs.addEventListener("mouseleave", () => { mouse = { x: -999, y: -999 }; draw(); });

      let t;
      window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => img.complete && build(), 200); });
    }
    initPortrait();

    // Projects: featured entries first, then public GitHub repos
    function card({ name, desc, meta, link, featured }) {
      const inner = `
        ${featured ? '<span class="feat">featured</span>' : ""}
        <h3>${esc(name)}</h3>
        <p>${esc(desc || "No description provided.")}</p>
        <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join("")}</div>`;
      return link
        ? `<a class="card" href="${esc(link)}" target="_blank" rel="noopener">${inner}</a>`
        : `<div class="card">${inner}</div>`;
    }

    async function loadProjects() {
      const grid = $("project-grid");
      const items = CONFIG.featured.map(f => ({ name: f.name, desc: f.desc, meta: f.tags, link: f.link, featured: true }));
      const taken = CONFIG.featured.map(f => f.name.toLowerCase().replace(/\s+/g, ""));

      try {
        const res = await fetch(`https://api.github.com/users/${CONFIG.githubUser}/repos?per_page=100&sort=updated`);
        if (!res.ok) throw new Error(res.status);
        const repos = (await res.json())
          .filter(r => !r.fork
            && !CONFIG.hideRepos.includes(r.name)
            && r.name.toLowerCase() !== `${CONFIG.githubUser.toLowerCase()}.github.io`
            && !taken.includes(r.name.toLowerCase().replace(/[-_\s]/g, "")))
          .sort((a, b) => (CONFIG.pinnedRepos.includes(b.name) - CONFIG.pinnedRepos.includes(a.name))
            || new Date(b.pushed_at) - new Date(a.pushed_at))
          .slice(0, CONFIG.maxRepos);

        repos.forEach(r => items.push({
          name: r.name, desc: r.description,
          meta: [r.language, r.stargazers_count ? `★ ${r.stargazers_count}` : ""].filter(Boolean),
          link: r.html_url
        }));
      } catch (e) { /* featured entries still show */ }

      grid.innerHTML = items.length
        ? items.map(card).join("")
        : '<p class="note">No public projects yet.</p>';
    }
    loadProjects();

    // Scroll reveal
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("visible"); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  </script>
</body>
</html>
